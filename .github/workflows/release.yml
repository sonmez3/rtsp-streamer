name: Release

# Push a tag like v1.0.0 to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (needed by the end-to-end tests)
        timeout-minutes: 10
        run: |
          # apt rebuilds the man page index after every install, which can take
          # many minutes on GitHub's runners. We don't need man pages here.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends ffmpeg

      - name: Test before releasing
        timeout-minutes: 10
        run: go test -race ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
