name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (needed by the end-to-end tests)
        timeout-minutes: 5
        run: bash .github/scripts/install-ffmpeg.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -race ./...
        timeout-minutes: 10

  package:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Build packages (snapshot, nothing is published)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      # This step tries apt first on purpose: it checks that the .deb pulls in
      # ffmpeg from Ubuntu the way it will on a user's machine. GitHub's
      # runners sometimes can't resolve the Ubuntu package servers' names; then
      # apt would hang until the timeout, so the step falls back to dpkg and a
      # static ffmpeg and leaves a warning on the run.
      - name: Install the .deb the way the README says
        timeout-minutes: 10
        run: |
          ls -l dist
          deb=./dist/rtsp-streamer_linux_amd64.deb
          dpkg-deb -f "$deb" Package Version Architecture Depends
          # The package must pull in ffmpeg, even if apt can't show it below.
          dpkg-deb -f "$deb" Depends | grep -qw ffmpeg
          # apt rebuilds the man page index after every install, which can
          # take minutes on GitHub's runners.
          sudo rm -f /var/lib/man-db/auto-update
          if sudo timeout 3m apt-get update -q --error-on=any &&
            sudo env DEBIAN_FRONTEND=noninteractive \
              timeout 4m apt-get install -y -q "$deb"; then
            echo "Installed with apt."
          else
            echo "::warning::Ubuntu package servers were unreachable, so the .deb was installed with dpkg and a static ffmpeg instead of apt."
            bash .github/scripts/install-ffmpeg.sh
            sudo dpkg -i --force-depends "$deb"
          fi
          rtsp-streamer --version

      - name: Stream a test video with the installed package
        timeout-minutes: 3
        run: |
          set -x
          ffmpeg -v error -f lavfi -i testsrc=size=320x240:rate=25 -t 3 -c:v libx264 /tmp/test.mp4
          rtsp-streamer /tmp/test.mp4 &
          pid=$!
          sleep 5
          timeout 15 ffprobe -v error -show_entries stream=codec_name -of csv=p=0 rtsp://127.0.0.1:8554/test | grep -x h264
          kill -INT "$pid"
          wait "$pid"

      - name: Check the tar.gz
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/rtsp-streamer_linux_amd64.tar.gz -C "$tmp"
          "$tmp"/rtsp-streamer_linux_amd64/rtsp-streamer --version
